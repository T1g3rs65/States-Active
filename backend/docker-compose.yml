# SovereignHex - One Command Server Setup
# 
# QUICK START:
#   docker-compose up -d
#
# That's it! Server runs at http://localhost:8001

version: '3.8'

services:
  # Game Server
  server:
    build: .
    container_name: sovereignhex-server
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # === CUSTOMIZE YOUR SERVER HERE ===
      - SERVER_NAME=My SovereignHex Server
      - SERVER_DESCRIPTION=Welcome to my SovereignHex server!
      - WORLD_SEED=123456
      - MAX_PLAYERS=50
      - ALLOW_MIGRATION=true
      # ===================================
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=sovereignhex
      - SERVER_VISIBILITY=public
      - SERVER_VERSION=1.0.0
    depends_on:
      - mongo

  # Database (included automatically!)
  mongo:
    image: mongo:7
    container_name: sovereignhex-mongo
    restart: unless-stopped
    volumes:
      - sovereignhex-data:/data/db

volumes:
  sovereignhex-data:
